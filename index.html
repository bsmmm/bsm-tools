<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSM Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#202124;--mute:#5f6368;--line:#dadce0;--hover:#f1f3f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--ink:#e8eaed;--mute:#9aa0a6;--line:#3c4043;--hover:#303134}}
:root[data-theme="dark"]{--bg:#202124;--ink:#e8eaed;--mute:#9aa0a6;--line:#3c4043;--hover:#303134}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:17px}
header{direction:ltr;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.top{display:flex;align-items:center;gap:20px;padding:10px 16px;overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.logo span{font:400 27px Lalezar,Tajawal,sans-serif;letter-spacing:.5px}
.tabs{display:flex;gap:2px;direction:rtl;flex:none}
.tab{border:0;background:transparent;color:var(--mute);font:500 16px Tajawal,sans-serif;padding:14px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-11px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:hover{background:var(--hover)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:36px 16px 48px}
.box{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:999px;padding:6px 20px;height:56px;transition:box-shadow .15s}
.box:focus-within,.box:hover{box-shadow:0 1px 8px rgba(32,33,36,.28);border-color:transparent}
.box svg{flex:none;color:var(--mute)}
#letter{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 24px Tajawal,sans-serif;outline:0;text-align:right}
.x{border:0;background:transparent;color:var(--mute);font-size:24px;cursor:pointer;border-radius:50%;width:32px;height:32px}
.x:hover{background:var(--hover)}
.btns{display:flex;justify-content:center;gap:10px;margin:22px 0 14px}
.btn{border:1px solid var(--hover);background:var(--hover);color:var(--ink);font:500 15px Tajawal,sans-serif;padding:10px 18px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--line)}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 26px}
.lt{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 18px Tajawal,sans-serif;cursor:pointer}
.lt:hover{background:var(--hover)}
.lt.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{border-top:1px solid var(--line)}
.cat{padding:16px 2px;border-bottom:1px solid var(--line)}
.cat b{display:block;font-size:15px;color:var(--mute);font-weight:500;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:8px;padding:5px 14px;font:inherit;font-size:19px;background:transparent;color:var(--ink);cursor:pointer}.chip:hover{background:var(--hover)}.chip.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.none{color:var(--mute);font-size:15px}
.empty{color:var(--mute);text-align:center;margin:30px 0}

.drop{border:2px dashed var(--line);border-radius:16px;padding:34px 16px;text-align:center;color:var(--mute);cursor:pointer}
.drop:hover,.drop.over,.drop:focus-visible{background:var(--hover);border-color:var(--mute)}
.drop svg{color:var(--ink)}
.drop p{margin:10px 0 0;line-height:1.7}
.drop b{color:var(--ink);font-size:19px}
.rc{display:flex;gap:14px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px;align-items:flex-start}
.rc img{width:120px;height:120px;object-fit:cover;border-radius:10px;flex:none;background:var(--hover)}
.rb{flex:1;min-width:0}
.pl{margin:0 0 2px;font-size:21px;font-weight:700}
.sub2{color:var(--mute);margin-bottom:8px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);margin:6px 0}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--ink)}
.rb ul{margin:6px 0;padding-inline-start:20px;font-size:15px;line-height:1.7}
.rb h4{margin:12px 0 2px;font-size:14px;color:var(--mute);font-weight:500}
.lk{display:inline-block;margin-top:10px;text-decoration:none}
@media (max-width:520px){.rc{flex-direction:column}.rc img{width:100%;height:180px}}
.hd{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.fl{font-size:44px;line-height:1}
.ex{margin:10px 0 12px;line-height:1.8}
.ar{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.afl{font-size:22px}
.pp{margin-inline-start:auto;color:var(--mute);font-weight:500}
.hm{min-width:0}
.cr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cn{font-size:26px;font-weight:700}
.pn{font-size:17px;margin-top:2px;color:var(--mute);font-family:Lalezar,Tajawal,sans-serif;letter-spacing:.3px}
.cp{padding:4px 12px;font-size:14px;border-radius:999px}
.am{min-width:0}.acn{font-weight:700}.apn{font-size:14px;color:var(--mute)}
.ar .pp{margin-inline-start:auto}
.fl,.afl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.kb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:12px;border:1px solid var(--line);border-radius:12px}
.kb input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:transparent;color:var(--ink);font:inherit;font-size:15px}
.kb p{flex-basis:100%;margin:0}
.kb select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.sg{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sgt{color:var(--mute);min-width:90px}
.sgb{border:1px solid var(--line);background:transparent;color:var(--ink);font:700 16px Tajawal,sans-serif;padding:8px 20px;border-radius:999px;cursor:pointer}
.sgb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.xb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;max-width:330px;margin:18px auto}
.xc{aspect-ratio:1;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);font:700 54px Tajawal,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.xc:hover{background:var(--hover)}
.xc small{font-size:14px;font-weight:500;color:var(--mute);margin-top:4px}
.xc.best{border-color:var(--ink);border-width:3px;background:var(--hover)}
.xs{text-align:center;font-size:18px;margin:8px 0}
.xr{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line);font-size:15px}
.xr span:last-child{color:var(--mute);text-align:left}
.xn{color:var(--mute);font-size:14px;margin:10px 0}
</style>
</head>

 el.innerHTML='<div class="box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'+
 '<input id="letter" maxlength="3" autocomplete="off" placeholder="اكتب حرف..." aria-label="الحرف"><button class="x" id="clr" aria-label="مسح">×</button></div>'+
 '<div class="btns"><button class="btn" id="go">بحث</button><button class="btn" id="rnd">حرف عشوائي</button></div>'+
 '<div class="row" id="lts"></div><div id="out"></div>';
 var lts=el.querySelector("#lts"),out=el.querySelector("#out"),inp=el.querySelector("#letter");
 function set(c){curLetter=c;inp.value=c;out.innerHTML=answers(c);
  [].forEach.call(lts.children,function(b){b.classList.toggle("on",b.textContent==c)})}
 L.forEach(function(c){var b=document.createElement("button");b.className="lt";b.textContent=c;b.onclick=function(){set(c)};lts.appendChild(b)});
 out.onclick=function(e){var c=e.target.closest(".chip");if(!c)return;copyTxt(c.textContent).then(function(){c.classList.add("ok");setTimeout(function(){c.classList.remove("ok")},700)})};
 inp.oninput=function(){set(norm(inp.value))};
 inp.onkeydown=function(e){if(e.key=="Enter")set(norm(inp.value))};
 el.querySelector("#go").onclick=function(){set(norm(inp.value))};
 el.querySelector("#clr").onclick=function(){set("");inp.focus()};
 el.querySelector("#rnd").onclick=function(){set(L[Math.floor(Math.random()*L.length)])};
 set(curLetter)}

var pasteH=null;
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function copyTxt(t){if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
 return new Promise(function(ok){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy")}catch(e){}x.remove();ok()})}
function toPng(b){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(b);im.onload=function(){var c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);URL.revokeObjectURL(u);c.toBlob(function(x){x?ok(x):no()},"image/png")};im.onerror=no;im.src=u})}
async function lensGo(b,body){
 var st=h("p","none","جاري التجهيز…"),btn=h("button","btn","انسخ الصورة وافتح Lens مرة ثانية");
 async function go(){var ok=false;
  try{var png=await toPng(b);await navigator.clipboard.write([new ClipboardItem({"image/png":png})]);ok=true}catch(e){}
  window.open("https://lens.google.com/?hl=ar","_blank");
  st.textContent=ok?"نسخت الصورة وفتحت Google Lens في المتصفح. اضغط Ctrl+V في صفحة Lens وبيبحث عنها.":"فتحت Google Lens، لكن ما قدرت أنسخ الصورة تلقائياً. اضغط الزر تحت للمحاولة، أو ارفع الصورة يدوياً في صفحة Lens."}
 var q=h("button","btn","انسخ السؤال: ما اسم الدولة؟"),row=h("div");row.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px";
 q.onclick=function(){copyTxt("ما اسم الدولة في هذه الصورة؟").then(function(){q.textContent="تم النسخ ✓";setTimeout(function(){q.textContent="انسخ السؤال: ما اسم الدولة؟"},1500)})};
 btn.onclick=go;row.append(btn,q);body.append(st,row);go()}
function lensGame(el){
 var box=h("div","drop");box.tabIndex=0;
 box.innerHTML='<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><p><b>الصق صورة هنا</b><br>Ctrl+V أو اسحب الصورة أو اضغط للاختيار<br>وبنسخها وأفتح لك Google Lens في المتصفح</p>';
 var file=h("input");file.type="file";file.accept="image/*";file.hidden=true;
 var wrap=h("div","btns"),pb=h("button","btn","لصق من الحافظة"),list=h("div");wrap.appendChild(pb);
 el.innerHTML="";el.append(box,file,wrap,list);
 function add(bs){bs.filter(function(b){return b&&/^image\//.test(b.type)}).slice(0,1).forEach(function(b){
  var c=h("div","rc"),im=h("img"),body=h("div","rb");im.src=URL.createObjectURL(b);im.alt="";c.append(im,body);list.prepend(c);lensGo(b,body)})}
 box.onclick=function(){file.click()};
 box.onkeydown=function(e){if(e.key=="Enter"||e.key==" "){e.preventDefault();file.click()}};
 file.onchange=function(){add([].slice.call(file.files));file.value=""};
 box.ondragover=function(e){e.preventDefault();box.classList.add("over")};
 box.ondragleave=function(){box.classList.remove("over")};
 box.ondrop=function(e){e.preventDefault();box.classList.remove("over");add([].slice.call(e.dataTransfer.files))};
 pasteH=function(e){var fs=[].slice.call(e.clipboardData.files||[]);
  if(!fs.length)[].forEach.call(e.clipboardData.items||[],function(i){if(i.kind=="file")fs.push(i.getAsFile())});
  if(fs.length){e.preventDefault();add(fs)}};
 document.addEventListener("paste",pasteH);
 pb.onclick=function(){
  if(!navigator.clipboard||!navigator.clipboard.read){list.prepend(h("p","none","استخدم Ctrl+V أو اختر الصورة من الجهاز"));return}
  navigator.clipboard.read().then(function(items){items.forEach(function(it){var t=it.types.filter(function(x){return /^image\//.test(x)})[0];if(t)it.getType(t).then(function(b){add([b])})})})
  .catch(function(){list.prepend(h("p","none","المتصفح ما سمح بالقراءة، استخدم Ctrl+V أو اختر الصورة من الجهاز"))})}}

var LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var XN=["زاوية فوق يسار","فوق في النص","زاوية فوق يمين","يسار في النص","الوسط","يمين في النص","زاوية تحت يسار","تحت في النص","زاوية تحت يمين"];
function winner(b){for(var i=0;i<8;i++){var l=LN[i];if(b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[0]]==b[l[2]])return b[l[0]]}return ""}
function xoGame(el){
 var st={me:"X",first:"me",b:["","","","","","","","",""],hist:[]},memo={},pm={};
 function opp(){return st.me=="X"?"O":"X"}
 function empt(b){var e=[];for(var i=0;i<9;i++)if(!b[i])e.push(i);return e}
 function prob(b,my){var w=winner(b);if(w)return w==st.me?[1,0,0]:[0,0,1];var e=empt(b);if(!e.length)return [0,1,0];
  var k=b.join("|")+my;if(memo[k])return memo[k];var r;
  if(my){var best=null,bs=-9;e.forEach(function(i){b[i]=st.me;var v=prob(b,false);b[i]="";var sc=v[0]+v[1]*.5-v[2]*.001;if(sc>bs){bs=sc;best=v}});r=best}
  else{r=[0,0,0];e.forEach(function(i){b[i]=opp();var v=prob(b,true);b[i]="";r[0]+=v[0]/e.length;r[1]+=v[1]/e.length;r[2]+=v[2]/e.length})}
  return memo[k]=r}
 function perf(b,my){var w=winner(b);if(w)return w==st.me?1:-1;var e=empt(b);if(!e.length)return 0;
  var k=b.join("|")+my;if(pm[k]!==undefined)return pm[k];var best=my?-2:2;
  e.forEach(function(i){b[i]=my?st.me:opp();var v=perf(b,!my);b[i]="";best=my?Math.max(best,v):Math.min(best,v)});
  return pm[k]=best}
 function myTurn(){var n=st.b.filter(Boolean).length,f=st.first=="me";return n%2==0?f:!f}
 var root=h("div");el.innerHTML="";el.appendChild(root);
 function seg(t,opts,get,set){var w=h("div","sg");w.appendChild(h("span","sgt",t));
  opts.forEach(function(o){var b=h("button","sgb",o[1]);b.setAttribute("aria-pressed",String(get()==o[0]));b.onclick=function(){set(o[0]);reset()};w.appendChild(b)});return w}
 function reset(){st.b=["","","","","","","","",""];st.hist=[];memo={};pm={};render()}
 function pc(x){return Math.round(x*100)+"%"}
 function render(){root.innerHTML="";
  root.appendChild(seg("أنت تلعب بـ",[["X","X"],["O","O"]],function(){return st.me},function(v){st.me=v}));
  root.appendChild(seg("من يبدأ؟",[["me","أنا"],["opp","الخصم"]],function(){return st.first},function(v){st.first=v}));
  var w=winner(st.b),e=empt(st.b),mine=myTurn(),sug=[];
  if(!w&&e.length&&mine){e.forEach(function(i){st.b[i]=st.me;sug.push({i:i,p:prob(st.b,false),f:perf(st.b,false)});st.b[i]=""});
   sug.sort(function(a,b){return (b.p[0]+b.p[1]*.5-b.p[2]*.001)-(a.p[0]+a.p[1]*.5-a.p[2]*.001)})}
  var msg=w?(w==st.me?"فزت! 🎉":"فاز الخصم"):!e.length?"تعادل":mine?"دورك. الخانة المميزة هي الأفضل، اضغط عليها لما تلعبها":"دور الخصم. اضغط على الخانة اللي لعبها";
  root.appendChild(h("p","xs",msg));
  var bd=h("div","xb");
  for(var i=0;i<9;i++)(function(i){var c=h("button","xc"),sg=sug.filter(function(x){return x.i==i})[0];
   c.setAttribute("aria-label",XN[i]);
   if(st.b[i])c.textContent=st.b[i];else if(sg){c.appendChild(h("small",0,pc(sg.p[0])));if(sug[0].i==i)c.classList.add("best")}
   c.onclick=function(){if(st.b[i]||winner(st.b))return;st.b[i]=mine?st.me:opp();st.hist.push(i);render()};bd.appendChild(c)})(i);
  root.appendChild(bd);
  if(sug.length){var bs=sug[0],lb=bs.f==1?"فوز مضمون":bs.f==0?"تعادل":"خسارة إذا لعب الخصم صح";
   root.appendChild(h("p","xs","أفضل خطوة: "+XN[bs.i]));
   root.appendChild(h("p","xn","مع لعب مثالي من الطرفين: "+lb+". الرقم داخل الخانة هو نسبة فوزك."));
   sug.forEach(function(x){var r=h("div","xr");r.append(h("span",0,XN[x.i]),h("span",0,"فوز "+pc(x.p[0])+"، تعادل "+pc(x.p[1])+"، خسارة "+pc(x.p[2])));root.appendChild(r)});
   root.appendChild(h("p","xn","النسب تفترض إن الخصم يلعب عشوائي، وإنك تلعب أفضل خطوة بعدها."))}
  var bt=h("div","btns"),u=h("button","btn","تراجع"),r=h("button","btn","لعبة جديدة");
  u.onclick=function(){var l=st.hist.pop();if(l!==undefined){st.b[l]="";render()}};r.onclick=reset;bt.append(u,r);root.appendChild(bt)}
 render()}

function draw(){if(pasteH){document.removeEventListener("paste",pasteH);pasteH=null}var t=document.getElementById("tabs");t.innerHTML="";
 GAMES.forEach(function(g){var b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
  b.setAttribute("aria-selected",g.id==cur);b.textContent=g.name;b.onclick=function(){cur=g.id;draw()};t.appendChild(b)});
 GAMES.filter(function(g){return g.id==cur})[0].render(document.getElementById("view"))}
draw();
</script>
